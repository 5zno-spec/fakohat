<style>
:root{--bg:#0f2e2b;--panel:#173f3a;--cell:#1f4f49;--cell2:#245b54;--ink:#fff7e6;--mute:#9fc9bd;--acc:#ffd23f;--bad:#ff6b5b;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:14px 14px 24px}
h1{margin:4px 0 12px;font-size:2rem;font-weight:800;color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--panel);border-radius:14px;padding:6px 8px;text-align:center}
.stat small{display:block;color:var(--mute);font-size:.78rem}
.stat b{font-size:1.25rem;font-weight:800}
.bar{height:10px;background:var(--panel);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
#board{position:relative;width:100%;--c:8;--r:8;aspect-ratio:calc(var(--c)/var(--r));container-type:inline-size;direction:ltr;touch-action:none;user-select:none;background:var(--panel);border-radius:18px;padding:0;overflow:hidden;
background-image:conic-gradient(var(--cell) 25%,var(--cell2) 0 50%,var(--cell) 0 75%,var(--cell2) 0);background-size:calc(200%/var(--c)) calc(200%/var(--r))}
.t{position:absolute;left:0;top:0;width:calc(100%/var(--c));height:calc(100%/var(--r));display:flex;align-items:center;justify-content:center;font-size:calc(60cqw/var(--c));line-height:1;
transition:translate .28s cubic-bezier(.3,1.2,.5,1),opacity .2s,scale .2s;cursor:pointer}
.t.sel{scale:1.18;filter:drop-shadow(0 0 8px var(--acc))}
.t.pop{opacity:0;scale:.2}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
@keyframes hint{0%,100%{scale:1}50%{scale:1.12}}
.logo{display:flex;flex-direction:column;align-items:center;margin:2px 0 10px}
.logo img{display:block;height:auto;width:auto;max-width:78%;max-height:210px}
@keyframes laugh{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}
.sb{transform-box:fill-box;transform-origin:50% 100%;animation:laugh 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sb{animation:none}}
.t.hint{animation:hint .8s ease-in-out infinite}
#map{position:fixed;inset:0;z-index:20;background:#a8da2f;overflow-x:hidden;overflow-y:auto;display:none;padding-top:env(safe-area-inset-top,0px)}
#map.on{display:block}
.mh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;max-width:480px;margin:0 auto;padding:12px 14px;background:rgba(15,46,43,.94);border-radius:0 0 18px 18px}
.mh h2{margin:0;color:var(--acc);font-size:1.5rem}
#mapbody{position:relative;max-width:480px;margin:0 auto;aspect-ratio:400/3136}
#mapbody svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.nd{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.5rem;line-height:1}
.nd small{font-size:.75rem;font-weight:800}
.nd span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:.8rem;white-space:nowrap;color:#5a2a00}
.nd{background:radial-gradient(circle at 35% 30%,#ffd166,#ff9f1c);box-shadow:0 4px 0 #b86a00,0 8px 10px rgba(0,0,0,.25);color:#5a2a00}
.nd.lk{background:radial-gradient(circle at 35% 30%,#fff,#e8d3b0);box-shadow:0 4px 0 #bfa57a;color:#8a7350;opacity:.9;cursor:default}
.nd.cur{background:radial-gradient(circle at 35% 30%,#ff8fb8,#e0245e);box-shadow:0 4px 0 #8e1038,0 0 0 6px rgba(255,255,255,.9),0 0 24px 10px rgba(255,255,255,.7);color:#fff;width:76px;height:76px}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.14)}}
.nd.cur{animation:pulse 1.3s ease-in-out infinite}
.dc{position:absolute;transform:translate(-50%,-50%);pointer-events:none;user-select:none;font-style:normal;line-height:1}
button{font:inherit;font-weight:800;background:var(--acc);color:#1b2b10;border:0;border-radius:14px;padding:10px 18px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ghost{background:var(--panel);color:var(--ink)}
#restart,#snd{display:inline-flex;align-items:center;justify-content:center;width:48px;height:44px;padding:0;line-height:0}
#msg{position:fixed;inset:0;margin:auto;width:min(86vw,340px);height:fit-content;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:26px;background:linear-gradient(135deg,rgba(255,255,255,.78),rgba(255,255,255,.42));backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1.5px solid rgba(255,255,255,.85);box-shadow:0 0 0 100vmax rgba(6,20,16,.45),0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.9);color:#0f2e2b;text-align:center;direction:rtl}
#msg.on{animation:winin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes winin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
#msg button{min-width:170px}
#msg .ghost{background:rgba(15,46,43,.12);color:#0f2e2b}
#msg.on{display:flex}
#msg h2{margin:0;font-size:1.8rem;color:#0f2e2b}
#msg p{margin:0;color:#2f6b62;font-weight:700}
@media (prefers-reduced-motion:reduce){.t{transition:none}.nd.cur{animation:none}.wt{animation:none}}
:root{color-scheme:light;--mute:#9a5472}
html{background:linear-gradient(180deg,#78c8ff 0%,#b4e2ff 24%,#e9f5ff 44%,#ffe5ef 70%,#ffc6da 100%) fixed}
body{background:transparent;color:#4a2236}
.stat{background:#fff;box-shadow:0 2px 8px rgba(214,90,130,.18)}
.stat b{color:#4a2236}
.bar{background:#fff;box-shadow:inset 0 1px 3px rgba(214,90,130,.3)}
.bar i{background:linear-gradient(90deg,#7be495,#2fb457)}
#board{box-shadow:0 8px 22px rgba(214,90,130,.35)}
.ghost{background:#fff;color:#8a2f55;box-shadow:0 2px 8px rgba(214,90,130,.2)}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
main{position:relative;z-index:1}
.cl{position:absolute;width:120px;height:34px;background:#fff;border-radius:34px;opacity:.92;filter:drop-shadow(0 5px 6px rgba(70,140,215,.25));animation:sway 7s ease-in-out infinite alternate}
.cl::before,.cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl::before{width:58px;height:58px;left:16px;top:-28px}
.cl::after{width:44px;height:44px;left:62px;top:-18px}
@keyframes sway{from{translate:-16px 0}to{translate:16px 0}}
@media (prefers-reduced-motion:reduce){.cl{animation:none}}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.top .logo{margin:0;flex:0 0 auto}
.top .logo img{width:112px;max-width:none;max-height:none;height:auto;animation:grow 1.8s ease-in-out infinite}
@keyframes grow{0%,100%{scale:1}50%{scale:1.13}}
.side{flex:1;min-width:0}
.top .stats{gap:6px;margin-bottom:8px}
.top .stat{padding:4px 4px}
.top .stat b{font-size:1.05rem}
.top .stat small{font-size:.7rem}
.sq{direction:rtl;height:18px;border-radius:10px;background:#fff;box-shadow:inset 0 1px 3px rgba(214,90,130,.3);overflow:hidden}
.sq i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(180deg,#7be495,#2fb457);box-shadow:inset 0 -3px 0 rgba(31,138,63,.35);transition:width .45s ease}
@media (prefers-reduced-motion:reduce){.top .logo img{animation:none}}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;overflow:hidden;background:linear-gradient(180deg,#78c8ff 0%,#b4e2ff 24%,#e9f5ff 44%,#ffe5ef 70%,#ffc6da 100%);transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash img{position:relative;width:min(62vw,270px);height:auto;animation:grow 1.6s ease-in-out infinite}
.ld{position:relative;direction:rtl;width:min(60vw,240px);height:16px;border-radius:10px;background:#fff;box-shadow:inset 0 1px 3px rgba(214,90,130,.3);overflow:hidden}
.ld i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#8be05a,#2fa84f);animation:load 3s ease-in-out forwards}
@keyframes load{to{width:100%}}
@media (prefers-reduced-motion:reduce){#splash img{animation:none}}
body{align-items:center;min-height:100vh;min-height:100dvh}
.row{justify-content:center}
main>p{text-align:center}
main{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#board{margin-top:auto;flex:0 0 auto}
main>p{margin-bottom:auto!important}
#home{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;overflow:hidden;background:linear-gradient(180deg,#78c8ff 0%,#b4e2ff 24%,#e9f5ff 44%,#ffe5ef 70%,#ffc6da 100%);transition:opacity .5s}
#home.out{opacity:0;pointer-events:none}
#home.off{display:none}
#home img{position:relative;width:min(66vw,290px);height:auto;animation:grow 1.6s ease-in-out infinite}
#play{position:relative;font-size:1.6rem;padding:12px 46px;border-radius:32px;color:#fff;background:linear-gradient(180deg,#ff9ac0,#ff4d7e);box-shadow:0 6px 0 #c2305c,0 12px 20px rgba(214,90,130,.4);animation:bob 1.6s ease-in-out infinite}
#homemap{position:relative;margin-top:0;font-size:1.3rem;padding:10px 40px;border-radius:30px;color:#fff;background:linear-gradient(180deg,#6fe08a,#2fb457);box-shadow:0 6px 0 #1f8a3f,0 12px 20px rgba(47,180,87,.4);animation:bob 1.6s ease-in-out infinite;animation-delay:.2s}
#homemap:active{translate:0 4px;box-shadow:0 2px 0 #1f8a3f}
#homeach{position:relative;margin-top:0;font-size:1.3rem;padding:10px 40px;border-radius:30px;color:#5a2a00;background:linear-gradient(180deg,#ffd166,#ff9f1c);box-shadow:0 6px 0 #b86a00,0 12px 20px rgba(255,159,28,.4);animation:bob 1.6s ease-in-out infinite;animation-delay:.4s}
#homeach:active{translate:0 4px;box-shadow:0 2px 0 #b86a00}
/* الحاسوب: الأزرار السفلية أبعد عن المربعات */
@media (min-width:700px){.row{margin-top:40px}}
@media (max-height:620px){#home{gap:18px}#home img{width:min(48vw,190px)}}
/* الجوال: عقد الخريطة أصغر قليلًا وبلا نبض واسع كي لا تتلامس مع المرحلة المجاورة */
@media (max-width:520px){.nd{width:50px;height:50px;font-size:1.25rem}.nd small{font-size:.68rem}.nd span{font-size:.62rem;top:calc(100% + 2px)}.nd.cur{width:60px;height:60px;box-shadow:0 4px 0 #8e1038,0 0 0 4px rgba(255,255,255,.9),0 0 16px 6px rgba(255,255,255,.7)}@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}}
#ach{position:fixed;inset:0;z-index:95;display:none;overflow-x:hidden;overflow-y:auto;background:linear-gradient(180deg,#78c8ff 0%,#b4e2ff 24%,#e9f5ff 44%,#ffe5ef 70%,#ffc6da 100%);padding-top:env(safe-area-inset-top,0px)}
#ach.on{display:block}
#achb{max-width:480px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
#achn{color:var(--ink);font-weight:800}
.ac{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#fff;color:#5a2a3c;box-shadow:0 4px 0 #e3a9c0,0 8px 14px rgba(0,0,0,.12)}
.ac i{font-style:normal;flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;line-height:1;background:radial-gradient(circle at 35% 30%,#ffd166,#ff9f1c);box-shadow:0 3px 0 #b86a00}
.ac.lk i{background:#e9e2e5;box-shadow:0 3px 0 #cbbfc4;opacity:.75}
.ac div{flex:1;min-width:0}
.ac b{display:block;font-size:1.1rem}
.ac small{display:block;color:#7d5a68;font-size:.85rem}
.ac .pb{height:8px;border-radius:6px;background:#f1dfe7;margin:6px 0 2px;overflow:hidden}
.ac .pb u{display:block;height:100%;background:linear-gradient(90deg,#ff9ac0,#ff4d7e)}
.atoast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;z-index:200;display:flex;align-items:center;gap:10px;max-width:min(92vw,360px);padding:10px 16px;border-radius:18px;background:rgba(15,46,43,.96);color:var(--ink);border:2px solid var(--acc);box-shadow:0 8px 20px rgba(0,0,0,.3);pointer-events:none;animation:atin 2.6s ease-in-out forwards}
.atoast b{font-size:1.8rem;line-height:1}
.atoast span{font-weight:800}
.atoast small{display:block;color:var(--acc);font-size:.75rem}
.pr{position:fixed;z-index:12;translate:-50% -50%;pointer-events:none;display:flex;align-items:center;justify-content:center;animation:prin 1.4s ease-in-out forwards}
.pr.st{width:clamp(70px,20vw,84px);aspect-ratio:1;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
.pr.st svg{width:100%;height:100%;overflow:visible}
.pr.st text{font-family:inherit;font-weight:800;font-size:17px;fill:#7a2a4e}
.pr.rc{padding:4px 14px;border-radius:12px;color:#7a2a4e;font-size:1rem;font-weight:800;white-space:nowrap;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.28)}
@keyframes prin{0%{opacity:0;scale:.3;translate:-50% -50%}18%{opacity:1;scale:1.12}30%{scale:1}78%{opacity:1;scale:1}100%{opacity:0;scale:.9;translate:-50% -130%}}
@media (prefers-reduced-motion:reduce){.pr{animation:prfade 1.4s forwards}@keyframes prfade{0%{opacity:0}15%,78%{opacity:1}100%{opacity:0}}}
@keyframes atin{0%{opacity:0;translate:-50% -24px}12%,86%{opacity:1;translate:-50% 0}100%{opacity:0;translate:-50% -24px}}
@media (prefers-reduced-motion:reduce){.atoast{animation:atfade 2.6s forwards}@keyframes atfade{0%{opacity:0;translate:-50% 0}12%,86%{opacity:1;translate:-50% 0}100%{opacity:0;translate:-50% 0}}}
#play:active{translate:0 4px;box-shadow:0 2px 0 #c2305c}
@keyframes winpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.hp{transform-box:fill-box;transform-origin:50% 100%;animation:hpulse 1.6s ease-in-out infinite}
@keyframes hpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@media (prefers-reduced-motion:reduce){.hp{animation:none}}
.wt{transform-box:fill-box;transform-origin:50% 100%;animation:winpulse 1.5s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
@media (prefers-reduced-motion:reduce){#home img,#play,#homemap,#homeach{animation:none}}
.cl.wc{animation:none;opacity:1}
#mapx,#back,#achx{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;width:58px;height:58px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;line-height:0;background:#fff;color:#8a2f55;box-shadow:0 4px 0 #e3a9c0,0 8px 16px rgba(0,0,0,.25)}
#mapx:active,#back:active,#achx:active{translate:0 3px;box-shadow:0 1px 0 #e3a9c0}

</style>

const rnd=()=>Math.floor(Math.random()*(level<=10?4:level<=20?5:6));
let AC,muted=false;try{muted=localStorage.getItem("qitaf-mute")==="1"}catch(e){}
function tone(f,d,type="sine",v=.22,delay=0){const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function sfx(k,n=1){if(muted)return;try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const S=[523,587,659,784,880,988,1175];
  if(k==="tap")tone(660,.08,"triangle");
  else if(k==="swap")tone(440,.1,"triangle");
  else if(k==="bad")tone(200,.18,"sawtooth",.07);
  else if(k==="match"){const f=S[Math.min(n-1,S.length-1)];tone(f,.18,"sine",.15);tone(f*1.5,.22,"sine",.08,.06)}
  else if(k==="win")[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.14,i*.12));
  else if(k==="lose")[392,330,262].forEach((f,i)=>tone(f,.3,"sine",.12,i*.18));
}catch(e){}}

function pos(t){t.el.style.translate=`${t.c*100}% ${t.r*100}%`}
function mk(r,c,type,fromRow){
  const el=document.createElement("div");el.className="t";el.textContent=F[type];
  const t={t:type,r,c,el,id:uid++};el.tile=t;
  if(fromRow!==undefined){const o=t.r;t.r=fromRow;pos(t);board.appendChild(el);el.offsetWidth;t.r=o;}else board.appendChild(el);
  pos(t);return t;
}
function ty(r,c){return grid[r]&&grid[r][c]?grid[r][c].t:-1}
function findMatches(){
  const s=new Set();
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const v=ty(r,c);if(v<0)continue;
    if(c<C-2&&ty(r,c+1)===v&&ty(r,c+2)===v)[0,1,2].forEach(k=>s.add(grid[r][c+k]));
    if(r<R-2&&ty(r+1,c)===v&&ty(r+2,c)===v)[0,1,2].forEach(k=>s.add(grid[r+k][c]));
  }
  return s;
}
function swapCells(a,b){
  grid[a.r][a.c]=b;grid[b.r][b.c]=a;
  [a.r,b.r]=[b.r,a.r];[a.c,b.c]=[b.c,a.c];pos(a);pos(b);
}
function findHint(){
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const [dr,dc] of [[0,1],[1,0]]){
    const r2=r+dr,c2=c+dc;if(r2>=R||c2>=C)continue;
    const a=grid[r][c],b=grid[r2][c2];
    swapCells(a,b);const ok=findMatches().size>0;swapCells(a,b);
    if(ok)return [a,b];
  }
  return null;
}
function ui(){
  $("sc").textContent=score;$("lv").textContent=level;$("bs").textContent=target();
  pgf.style.width=(Math.min(1,score/target())*100).toFixed(1)+"%";
}
function newLevel(lv){
  board.querySelectorAll(".t").forEach(e=>e.remove());msg.className="";
  level=lv||level||1;score=0;
  const sz=SIZES[Math.min(Math.floor((level-1)/3),SIZES.length-1)];C=sz[0];R=sz[1];board.style.setProperty("--c",C);board.style.setProperty("--r",R);
  maxCombo=0;pm=0;grid=[];sel=null;
  for(let r=0;r<R;r++){grid[r]=[];for(let c=0;c<C;c++){
    let v;do{v=rnd()}while((c>1&&ty(r,c-1)===v&&ty(r,c-2)===v)||(r>1&&ty(r-1,c)===v&&ty(r-2,c)===v));
    grid[r][c]=mk(r,c,v);
  }}
  if(!findHint())shuffle();
  busy=false;ui();armHint(300);
}
function shuffle(){
  const all=grid.flat();
  do{all.forEach(t=>{t.t=rnd();t.el.textContent=F[t.t]})}while(findMatches().size||!findHint());
}
async function resolve(){
  let combo=0,m;
  while((m=findMatches()).size){
    combo++;if(combo>maxCombo)maxCombo=combo;if(combo>ach.mc)ach.mc=combo;ach.fr+=m.size;if(combo===1){let hx=0,hy=0;m.forEach(t=>{const q=t.el.getBoundingClientRect();hx+=q.left+q.width/2;hy+=q.top+q.height/2});hit={x:hx/m.size,y:hy/m.size}}score+=m.size;
    if(score>best){best=score;try{localStorage.setItem("qitaf-best",best)}catch(e){}}
    ui();sfx("match",combo);m.forEach(t=>{t.el.classList.add("pop");grid[t.r][t.c]=null});
    await sleep(230);m.forEach(t=>t.el.remove());
    for(let c=0;c<C;c++){
      let w=R-1;
      for(let r=R-1;r>=0;r--)if(grid[r][c]){const t=grid[r][c];grid[r][c]=null;t.r=w;grid[w][c]=t;pos(t);w--;}
      for(let k=0,r=w;r>=0;r--,k++)grid[r][c]=mk(r,c,rnd(),-1-k);
    }
    await sleep(320);
  }
  saveAch();chk();
  if(!findHint()){shuffle()}
}
async function swap(a,b){
  if(busy)return;busy=true;clearSel();clearHint();
  sfx("swap");swapCells(a,b);await sleep(220);
  if(!findMatches().size){sfx("bad");swapCells(a,b);await sleep(220);busy=false;armHint();return}
  ui();await resolve();ui();
  if(score<target())praise(++pm);
  if(score>=target()){
    const st=maxCombo>=3?3:maxCombo>=2?2:1;saveWin(level,st);chk();
    msg.innerHTML=`<h2>أحسنت! 🎉</h2><p>${"⭐".repeat(st)}</p><p>أنهيت المرحلة ${level}</p><button id="nx">المرحلة التالية</button><button class="ghost" id="mp">الخريطة</button>`;
    sfx("win");msg.className="on";confetti();$("nx").onclick=()=>cloudSwap(()=>level<TOTAL?newLevel(level+1):go("map"));$("mp").onclick=()=>cloudSwap(()=>go("map"));return;
  }
  if(false){
    msg.innerHTML=`<h2>انتهت الحركات</h2><p>نقاطك ${score} من ${target()}</p><button id="rt">حاول مرة أخرى</button><button class="ghost" id="mp">الخريطة</button>`;
    sfx("lose");msg.className="on";$("rt").onclick=()=>newLevel(level);$("mp").onclick=()=>go("map");return;
  }
  busy=false;armHint(800);
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const fx=document.createElement("div");fx.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden";document.body.appendChild(fx);
  const W=innerWidth,H=innerHeight,cols=["#ffd23f","#ff6b5b","#5ad1b5","#7aa8ff","#ff8fb8","#ffffff"];
  for(let i=0;i<110;i++){
    const left=i%2===0,p=document.createElement("i");
    p.style.cssText=`position:absolute;left:${left?4:W-4}px;top:${H-4}px;width:${6+Math.random()*6}px;height:${10+Math.random()*8}px;background:${cols[i%cols.length]};border-radius:2px`;
    fx.appendChild(p);
    const dx=(left?1:-1)*(W*(.15+Math.random()*.6)),up=-H*(.45+Math.random()*.55),rot=(Math.random()-.5)*1080;
    p.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${dx*.6}px,${up}px) rotate(${rot*.5}deg)`,opacity:1,offset:.4},{transform:`translate(${dx}px,${H*.25}px) rotate(${rot}deg)`,opacity:0}],{duration:1800+Math.random()*1400,delay:Math.random()*350,easing:"cubic-bezier(.2,.7,.4,1)",fill:"forwards"});
  }
  [["🎉",4],["🎊",W-48]].forEach(([e,x])=>{const b=document.createElement("span");b.textContent=e;b.style.cssText=`position:absolute;left:${x}px;bottom:2px;font-size:44px;line-height:1`;fx.appendChild(b);b.animate([{transform:"scale(.3) rotate(-20deg)"},{transform:"scale(1.3) rotate(10deg)"},{transform:"scale(1) rotate(0)"}],{duration:600,easing:"ease-out"})});
  setTimeout(()=>fx.remove(),3800);
}

  const a=start.t;start=null;
  let r=a.r,c=a.c;
  if(Math.abs(dx)>Math.abs(dy))c+=dx>0?1:-1;else r+=dy>0?1:-1;
  if(r<0||c<0||r>=R||c>=C)return;
  swap(a,grid[r][c]);
});
board.addEventListener("pointerup",()=>{
  if(!start||busy){start=null;return}
  const t=start.t;start=null;
  if(sel&&sel!==t&&adj(sel,t)){swap(sel,t);return}
  const same=sel===t;clearSel();
  if(!same){sel=t;t.el.classList.add("sel");sfx("tap")}
});
board.addEventListener("pointerleave",()=>{start=null});
let ht=null,hintEls=[];
function clearHint(){clearTimeout(ht);hintEls.forEach(t=>t.el.classList.remove("hint"));hintEls=[]}
function armHint(d=4000){clearHint();if(level>10||busy||msg.className)return;
  ht=setTimeout(()=>{if(busy||level>10||msg.className)return;const h=findHint();if(h){hintEls=h;h.forEach(t=>t.el.classList.add("hint"))}},d)}
board.addEventListener("pointerdown",clearHint);
board.addEventListener("pointerup",()=>armHint());
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume();const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0)}catch(e){}}
["pointerdown","pointerup","touchend","click","keydown"].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
$("restart").onclick=()=>newLevel(level);
function setSnd(){$("snd").innerHTML=muted?`<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M3 9.5h3.6L11.5 5.2a.8.8 0 0 1 1.3.6v12.4a.8.8 0 0 1-1.3.6L6.6 14.5H3z"/><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></g></svg>`:`<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M3 9.5h3.6L11.5 5.2a.8.8 0 0 1 1.3.6v12.4a.8.8 0 0 1-1.3.6L6.6 14.5H3z"/><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M16 9a4.2 4.2 0 0 1 0 6"/><path d="M18.6 6.4a8 8 0 0 1 0 11.2"/></g></svg>`}
setSnd();
$("snd").onclick=()=>{muted=!muted;setSnd();try{localStorage.setItem("qitaf-mute",muted?"1":"0")}catch(e){}sfx("tap")};
/* التنقل: الرئيسية ← (الخريطة | الإنجازات | اللعب)؛ سهم الرجوع يعود صفحة صفحة حتى الواجهة الرئيسية */
const hm=$("home"),stack=["home"];
function show(s){
  hm.classList.toggle("off",s!=="home");
  $("map").className="";$("ach").className="";
  if(s==="map")showMap();else if(s==="ach")showAch();
}
function go(s){if(stack[stack.length-1]!==s)stack.push(s);show(s)}
function goBack(){if(stack.length>1)stack.pop();show(stack[stack.length-1])}
$("back").onclick=()=>cloudSwap(goBack);
$("mapbtn").onclick=()=>cloudSwap(()=>go("map"));
$("mapx").onclick=()=>cloudSwap(goBack);
$("mapbody").onclick=e=>{const b=e.target.closest(".nd");if(b&&!b.disabled)cloudSwap(()=>{stack.pop();go("game");newLevel(+b.dataset.l)})};
newLevel(Math.min(prog.unlocked,TOTAL));
const lg=document.querySelector(".logo img").src;hm.querySelector("img").src=lg;
$("play").onclick=()=>{sfx("tap");cloudSwap(()=>go("game"))};
$("homemap").onclick=()=>{sfx("tap");cloudSwap(()=>go("map"))};
$("homeach").onclick=()=>{sfx("tap");go("ach")};
$("achx").onclick=()=>{sfx("tap");goBack()};
/* على الحاسوب: زر الرجوع تحت المربعات عند حافتها اليسرى ويخرج عنها قليلًا */
const bks=[$("back"),$("mapx"),$("achx")],wide=matchMedia("(min-width:700px)");
function placeBack(){
  if(!wide.matches){bks.forEach(b=>["left","top","bottom"].forEach(p=>b.style.removeProperty(p)));return}
  /* الخريطة والإنجازات تغطيان اللعبة لكن مربعاتها تبقى في مكانها، فنستعمل قياساتها نفسها لتطابق الأزرار الثلاثة تمامًا */
  const r=board.getBoundingClientRect(),rowT=document.querySelector(".row").getBoundingClientRect().top;
  bks.forEach(b=>{
    b.style.left=Math.max(8,r.left-22)+"px";
    b.style.top=Math.min(rowT,innerHeight-66)+"px";
    b.style.bottom="auto";
  });
}
addEventListener("resize",placeBack);addEventListener("scroll",placeBack,{passive:true});addEventListener("load",placeBack);
if(window.ResizeObserver)new ResizeObserver(placeBack).observe(board);
placeBack();
chk(true);
/* حفظ دائم للتقدّم: تخزين غير قابل للمسح + نسخة احتياطية في IndexedDB تُستعاد إن مُسح localStorage */
const KEYS=["qitaf-best","qitaf-prog","qitaf-ach","qitaf-mute"];
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open("fakohat",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
async function mirror(){
  try{
    const db=await idb(),tx=db.transaction("kv","readwrite"),s=tx.objectStore("kv");
    KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)s.put(v,k)});
    tx.oncomplete=tx.onerror=tx.onabort=()=>db.close();
  }catch(e){}
}
async function restore(){
  try{
    if(localStorage.getItem("qitaf-prog")!==null)return;
    const db=await idb(),s=db.transaction("kv").objectStore("kv");
    const got=await Promise.all(KEYS.map(k=>new Promise(ok=>{const q=s.get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(undefined)})));
    db.close();
    if(got[1]===undefined)return;
    KEYS.forEach((k,i)=>{if(got[i]!==undefined)localStorage.setItem(k,got[i])});
    Object.assign(prog,JSON.parse(got[1]));
    if(got[2])Object.assign(ach,JSON.parse(got[2]));
    best=Math.max(best,+got[0]||0);muted=got[3]==="1";setSnd();
    if(!score)newLevel(Math.min(prog.unlocked,TOTAL));
  }catch(e){}
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
restore().then(mirror);
addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")mirror()});
addEventListener("pagehide",mirror);
const sp=$("splash");sp.querySelector("img").src=lg;
addEventListener("beforeinstallprompt",e=>e.preventDefault());
let cg=false;
function cloudSwap(mid){
  if(cg)return;cg=true;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){mid();cg=false;return}
  const fog=document.createElement("div");
  fog.style.cssText="position:fixed;inset:0;z-index:120;pointer-events:all;background:linear-gradient(180deg,#b4e2ff,#fff 50%,#ffd6e5);opacity:0";
  document.body.appendChild(fog);
  const a=fog.animate([{opacity:0},{opacity:1}],{duration:380,easing:"ease-in",fill:"forwards"});
  a.onfinish=()=>{
    mid();
    requestAnimationFrame(()=>{
      const o=fog.animate([{opacity:1},{opacity:0}],{duration:420,easing:"ease-out",fill:"forwards"});
      o.onfinish=()=>{fog.remove();cg=false};
    });
  };
}
setTimeout(()=>cloudSwap(()=>sp.remove()),3000);
</script>
